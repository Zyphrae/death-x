name: Build Death X

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Validate mod metadata
        run: python scripts/validate-mod-json.py mod.json

      - name: Validate mod logo
        run: python scripts/validate-logo.py logo.png

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Merge platform packages
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload merged package
        uses: actions/upload-artifact@v7
        with:
          name: Death-X
          path: ${{ steps.build.outputs.build-output }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "${{ steps.build.outputs.build-output }}"/*.geode
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "Death X ${GITHUB_REF_NAME}"
